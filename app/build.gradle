plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'in.kvapps.wirelessstart'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "in.kvapps.wirelessstart"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
        // Read from local.properties using Groovy syntax
        Properties properties = new Properties()
        if (project.rootProject.file('local.properties').exists()) {
            properties.load(project.rootProject.file('local.properties').newDataInputStream())
        }

        // Use 'def' instead of 'val'
        def macAddress = properties.getProperty('ESP32_MAC_ADDRESS') ?: "\"00:00:00:00:00:00\""

        // Inject into BuildConfig
        buildConfigField "String", "ESP32_MAC", macAddress

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit

    // Google Wearable Sync Data Pipeline API
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Custom Shared Module to hold common code between PhoneApp and WearApp
    implementation project(':shared')
}